# =================================================================
# CLYVO Predict — application-prod.properties
# Banco: MySQL 8 no ACI (mesmo container group → localhost)
# =================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/clyvodb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clyvo_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Clyvo@Pass123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=8080

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

logging.level.root=INFO
logging.level.br.com.fiap.clyvo=DEBUG
