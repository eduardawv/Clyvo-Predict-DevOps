version: "3.9"

services:
  mysql-db:
    image: mysql:8.0
    container_name: clyvo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ClyvoRoot@2024
      MYSQL_DATABASE: clyvodb
      MYSQL_USER: clyvo_user
      MYSQL_PASSWORD: Clyvo@Pass123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - clyvo-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pClyvoRoot@2024"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  clyvo-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clyvo-predict-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-db:3306/clyvodb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: clyvo_user
      SPRING_DATASOURCE_PASSWORD: Clyvo@Pass123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - clyvo-net

networks:
  clyvo-net:
    driver: bridge

volumes:
  mysql_data:
    name: clyvo_mysql_data
