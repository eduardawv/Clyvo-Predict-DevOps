# =================================================================
# CLYVO Predict — application-prod.properties
# Perfil: prod (ativo no container via SPRING_PROFILES_ACTIVE=prod)
# Banco: Oracle XE no mesmo ACI group → host = localhost
# =================================================================

# Oracle via ACI (containers no mesmo grupo compartilham localhost)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/CLYVODB
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clyvo_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Clyvo@Pass123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Servidor
server.port=8080

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# Health check (Actuator)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Log
logging.level.root=INFO
logging.level.br.com.fiap.clyvo=DEBUG
