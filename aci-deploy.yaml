# =================================================================
# CLYVO Predict — Multi-container ACI (Azure Container Instance)
# Containers no mesmo grupo compartilham localhost
# App → Oracle via jdbc:oracle:thin:@localhost:1521/CLYVODB
# =================================================================
# USO:
#   az container create \
#     --resource-group rg-clyvo-predict-s3 \
#     --file aci-deploy.yaml
# =================================================================

apiVersion: "2021-10-01"
name: clyvo-predict-group
location: eastus
type: Microsoft.ContainerInstance/containerGroups
properties:

  # Política de restart: Always (equivalente a restart: unless-stopped)
  restartPolicy: Always

  osType: Linux

  # IP público expondo apenas a porta da API
  ipAddress:
    type: Public
    dnsNameLabel: clyvo-predict-api    # URL: clyvo-predict-api.<region>.azurecontainer.io
    ports:
      - protocol: tcp
        port: 8080

  # Credenciais do ACR (serão substituídas pelo script)
  imageRegistryCredentials:
    - server: __ACR_SERVER__
      username: __ACR_USER__
      password: __ACR_PASS__

  containers:

    # ── Container 1: Oracle XE 21c ──────────────────────────
    - name: oracle-db
      properties:
        image: gvenzl/oracle-xe:21-slim
        resources:
          requests:
            cpu: 1.0
            memoryInGB: 2.0
        environmentVariables:
          - name: ORACLE_PASSWORD
            secureValue: ClyvoPredict@2024
          - name: ORACLE_DATABASE
            value: CLYVODB
          - name: APP_USER
            value: clyvo_user
          - name: APP_USER_PASSWORD
            secureValue: Clyvo@Pass123
        ports:
          - port: 1521
            protocol: TCP
        # Volume para persistência dos dados do Oracle
        volumeMounts:
          - name: oracle-data
            mountPath: /opt/oracle/oradata

    # ── Container 2: Java Spring Boot API ───────────────────
    - name: clyvo-api
      properties:
        image: __ACR_SERVER__/clyvo-predict:latest
        resources:
          requests:
            cpu: 0.5
            memoryInGB: 1.0
        environmentVariables:
          - name: SPRING_PROFILES_ACTIVE
            value: prod
          - name: SPRING_DATASOURCE_URL
            # localhost porque estão no mesmo grupo ACI
            value: jdbc:oracle:thin:@localhost:1521/CLYVODB
          - name: SPRING_DATASOURCE_USERNAME
            value: clyvo_user
          - name: SPRING_DATASOURCE_PASSWORD
            secureValue: Clyvo@Pass123
          - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
            value: oracle.jdbc.OracleDriver
          - name: SPRING_JPA_DATABASE_PLATFORM
            value: org.hibernate.dialect.OracleDialect
          - name: SPRING_JPA_HIBERNATE_DDL_AUTO
            value: update
          - name: SPRINGDOC_SWAGGER_UI_PATH
            value: /swagger-ui.html
          - name: JAVA_OPTS
            value: "-Xms256m -Xmx512m"
        ports:
          - port: 8080
            protocol: TCP

  # Volume Azure Files para persistência (volume nomeado)
  volumes:
    - name: oracle-data
      azureFile:
        shareName: oracle-data
        storageAccountName: __STORAGE_ACCOUNT__
        storageAccountKey: __STORAGE_KEY__
