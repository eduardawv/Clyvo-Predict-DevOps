apiVersion: "2021-10-01"
name: clyvo-predict-group
location: eastus
type: Microsoft.ContainerInstance/containerGroups
properties:
  restartPolicy: Always
  osType: Linux
  ipAddress:
    type: Public
    dnsNameLabel: clyvo-predict-api
    ports:
      - protocol: tcp
        port: 8080
  imageRegistryCredentials:
    - server: __ACR_SERVER__
      username: __ACR_USER__
      password: __ACR_PASS__
  containers:
    - name: mysql-db
      properties:
        image: mysql:8.0
        resources:
          requests:
            cpu: 0.5
            memoryInGB: 1.0
        environmentVariables:
          - name: MYSQL_ROOT_PASSWORD
            secureValue: ClyvoRoot@2024
          - name: MYSQL_DATABASE
            value: clyvodb
          - name: MYSQL_USER
            value: clyvo_user
          - name: MYSQL_PASSWORD
            secureValue: Clyvo@Pass123
        ports:
          - port: 3306
            protocol: TCP
    - name: clyvo-api
      properties:
        image: __ACR_SERVER__/clyvo-predict:latest
        resources:
          requests:
            cpu: 0.5
            memoryInGB: 1.0
        environmentVariables:
          - name: SPRING_PROFILES_ACTIVE
            value: prod
          - name: SPRING_DATASOURCE_URL
            value: "jdbc:mysql://localhost:3306/clyvodb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          - name: SPRING_DATASOURCE_USERNAME
            value: clyvo_user
          - name: SPRING_DATASOURCE_PASSWORD
            secureValue: Clyvo@Pass123
          - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
            value: com.mysql.cj.jdbc.Driver
          - name: SPRING_JPA_DATABASE_PLATFORM
            value: org.hibernate.dialect.MySQLDialect
          - name: SPRING_JPA_HIBERNATE_DDL_AUTO
            value: update
        ports:
          - port: 8080
            protocol: TCP
